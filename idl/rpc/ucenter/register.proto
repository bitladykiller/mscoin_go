syntax = "proto3";

package register;

// Keep the generated package aligned with the shared grpc-common contract path.
option go_package = "grpc-common/ucenter/types/register";

message RegReq {
  string username = 1;
  string password = 2;
  CaptchaReq captcha = 3;
  string phone = 4;
  string promotion = 5;
  string code = 6;
  string country = 7;
  string superPartner = 8;
  string ip = 9;
}

message CaptchaReq {
  string server = 1;
  string token = 2;
}

message RegRes {}

message NoRes {}

message CodeReq {
  string phone = 1;
  string country = 2;
}

service Register {
  rpc registerByPhone(RegReq) returns(RegRes);
  rpc sendCode(CodeReq) returns(NoRes);
}
